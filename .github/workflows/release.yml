name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag
      issues: write # @semantic-release/github comments on released issues
      pull-requests: write # ...and on released PRs
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN needed

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24.x

      # Trusted publishing needs npm >= 11.5.1. Pinned rather than @latest
      # because this job holds an OIDC credential that can publish.
      - name: Update npm
        run: npm install -g npm@11.5.1 --ignore-scripts

      # --ignore-scripts keeps lifecycle scripts out of a job that can publish.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # - name: Run tests
      #   run: npm test

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
