# Weekly grouped updates: one PR for all minor+patch bumps per ecosystem, one
# for security fixes. Majors stay as individual PRs for review.
# Patch/minor PRs auto-merge once CI passes
# (.github/workflows/dependabot-automerge.yml).
# Managed from jjeff/repo-upkeep.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
